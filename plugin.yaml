name: mcp-smart-filter
version: 2.0.0
manifest_version: 1
api_version: 1

description: >
  Provides in-process FastEmbed semantic vector search for Hermes Agent
  tool discovery, replacing built-in BM25 tool_search for large toolsets (1000+).

author: Marten Lucas
homepage: https://github.com/marten-lucas/hermes-mcp-smartfilter-plugin
license: MIT

tags:
  - mcp
  - tool-search
  - vector-search
  - fastembed
  - smart-routing

kind: standalone

capabilities:
  - tools.override

python_dependencies:
  - "fastembed>=0.3.0,<1"
  - "numpy>=1.20.0,<3"

requires_env: []

provides_tools:
  # Primär: Override des nativen tool_search (erfordert Capability tools.override).
  # Fallback: eigenständige Registrierung als semantic_tool_search.
  - tool_search
  - semantic_tool_search
