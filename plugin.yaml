name: mcp-smart-filter
version: 2.0.0
manifest_version: 1
api_version: 1

description: >
  Provides in-process FastEmbed semantic vector search for Hermes Agent
  tool discovery, replacing built-in BM25 tool_search for large toolsets (1000+).

author: Marten Lucas
homepage: https://github.com/marten-lucas/hermes-mcp-smartfilter-plugin
license: MIT

tags:
  - mcp
  - tool-search
  - vector-search
  - fastembed
  - smart-routing

kind: general

capabilities:
  - tools.override

python_dependencies:
  - "fastembed>=0.3.0"
  - "numpy>=1.20.0"

requires_env: []

provides_tools:
  - tool_search
